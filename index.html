<html lang="en">
<head>

<style>
/* Always light. Palette: deep navy band, white content, one blue accent, soft status pills */
:root {
  color-scheme: light only;
  --navy: #161a54; --navy-2: #232a7c;
  --page: #eef0f5; --card: #ffffff; --soft: #f6f7fb;
  --ink: #1d2140; --ink-2: #4b5068; --muted: #7c8297;
  --line: #e7e9f0; --grid: #eceef4; --axis: #c9cddb;

  --teal: #3fa38c; --teal-tint: #e0f3ee; --teal-ink: #2a8771;
  --orange: #ee6c2c; --orange-tint: #fdecdc; --orange-ink: #c9601b;
  --plan: #7c8297;
  --shadow: 0 2px 12px rgba(22, 26, 84, .07);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }

/* Navy band with fine diagonal lines */
.band { background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.045) 0 1px, transparent 1px 22px),
    linear-gradient(100deg, var(--navy) 0%, var(--navy-2) 100%);
  color: #fff; }
.band .inner { max-width: none; margin: 0 auto; padding: 22px 16px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px 18px; }
.band .logo { height: 34px; width: auto; display: block; }
.band .divider { width: 1px; height: 26px; background: rgba(255,255,255,.25); }
.band h1 { position: relative; top: 2px; margin: 0; font-size: 17px; font-weight: 500; letter-spacing: .01em; color: rgba(255,255,255,.92); }
.band .spacer { flex: 1; }
.band .btn { font: inherit; font-size: 13px; font-weight: 500; color: #fff; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.28); border-radius: 8px; padding: 7px 13px; cursor: pointer; }
.band .btn:hover { background: rgba(255,255,255,.16); }

/* Tabs */
.tabs-wrap { border-bottom: 1px solid var(--line); background: #ffffff; }
.tabs { max-width: none; margin: 0 auto; padding: 0 16px; display: flex; gap: 28px; }
.tab { font: inherit; font-size: 15px; font-weight: 500; color: var(--ink); background: none; border: 0; padding: 16px 2px 13px; border-bottom: 3px solid transparent; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--blue); border-bottom-color: var(--blue); }
.tab .count { font-size: 12px; color: var(--orange-ink); background: var(--orange-tint); border-radius: 10px; padding: 1px 7px; margin-left: 6px; }

.wrap { max-width: none; margin: 0 auto; padding: 22px 16px 56px; }
.page-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 6px; }
.page-sub { margin: 0 0 14px; color: var(--ink-2); font-size: 15px; }
.purpose { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 0; background: var(--soft); border-radius: 10px; margin-bottom: 26px; }
.purpose > div { padding: 12px 16px; border-left: 1px solid var(--line); }
.purpose > div:first-child { border-left: 0; }
.purpose p { margin: 4px 0 0; font-size: 13px; color: var(--ink); }
.purpose p b { font-weight: 600; }
@media (max-width: 760px) { .purpose { grid-template-columns: 1fr; } .purpose > div { border-left: 0; border-top: 1px solid var(--line); } .purpose > div:first-child { border-top: 0; } }
.page-head h2 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
.page-head .context { color: var(--ink-2); font-size: 13px; }
.page-head .context b { color: var(--ink); font-weight: 600; }

.label { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.section-title { margin: 30px 0 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 18px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--ink-2); margin-bottom: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* KPI tiles: fixed slots so values, comparisons and text line up across cards */
.group { margin-bottom: 26px; }
.group-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 12px; }
.group-head h3 { margin: 0; font-size: 19px; font-weight: 600; }
.group-head span { color: var(--ink-2); font-size: 13px; }
.group-head { margin-bottom: 18px; }
.tiles { grid-template-rows: auto auto; }
.cell { display: grid; grid-row: span 2; grid-template-rows: subgrid; row-gap: 10px; min-width: 0; }
.summary { margin: 0; align-self: start; padding: 0 17px; }
.summary .headline { margin: 0; font-size: 14px; font-weight: 600; color: var(--ink); }
.summary .facts { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-2); }
.sep { color: var(--axis); margin: 0 8px; }
/* Unit economics table */
.ue-summary { padding: 0 17px; margin-bottom: 10px; }

.ue-summary .facts { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-2); }
.ue-card { padding: 6px 16px 10px; }
.ue-grid { display: grid; grid-template-columns: 84px minmax(150px, 1.3fr) 84px 84px minmax(120px, 2.4fr) 92px; align-items: center; column-gap: 16px; }
.ue-r { display: contents; }
.ue-r > div { padding: 14px 0; border-bottom: 1px solid var(--line); }

.ue-h { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; padding: 12px 0 10px !important; }
.ue-h .dot, .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.dot.eu { background: var(--blue); } .dot.us { background: #b9bdcb; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.ue-step { font-size: 11px; font-weight: 600; color: var(--blue); text-transform: uppercase; letter-spacing: .07em; }
.ue-label { font-size: 14px; font-weight: 500; color: var(--ink); display: flex; align-items: center; gap: 8px; }

.ue-cmp { font-size: 14px; font-weight: 600; color: var(--ink); }
.ue-bars { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 6px 0; }
.ue-bar { height: 10px; border-radius: 0 4px 4px 0; min-width: 2px; }

.ue-contract em { position: absolute; top: -12px; left: 4px; font-style: normal; font-size: 10.5px; color: var(--orange-ink); white-space: nowrap; }
.pb-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.pr-body { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; }
.pr-stats { display: grid; grid-template-columns: repeat(3, auto); gap: 44px; padding-right: 36px; }
.pr-stats .cv-d { max-width: 170px; }
.pr-cases { display: grid; grid-template-columns: 1fr; gap: 14px; padding-left: 36px; border-left: 1px solid var(--line); }
.pr-case { font-size: 13px; font-weight: 600; color: var(--ink); }
.pr-cases p { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
.mk-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.mk-stats .cx-num { font-size: 30px; }
.link-btn { margin-top: auto; align-self: flex-start; background: none; border: 0; padding: 14px 0 0; font: inherit; font-size: 13px; font-weight: 500; color: var(--blue); cursor: pointer; }
.link-btn:hover { text-decoration: underline; }
#marketCard h4 { display: flex; align-items: center; gap: 8px; }
.pr-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: stretch; }
.pr-top { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.pr-lead { margin: -6px 0 14px; font-size: 13px; color: var(--ink-2); }
.pr-table td:first-child { color: var(--ink-2); }
.pr-table td.gapc { color: var(--orange-ink); font-weight: 600; }
.pr-new { margin-top: 14px; }
.pr-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.pr-chips span { font-size: 12.5px; background: var(--soft); border-radius: 6px; padding: 4px 10px; color: var(--ink-2); }
.pr-chips b { color: var(--ink); margin-left: 4px; }
.cv-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.cv-head h4 { margin: 0 !important; }
.cv-head select { font: inherit; font-size: 13px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); min-width: 220px; }
.cv-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 32px; }
.cv-sub { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 10px; }
.cv-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
#oppCard .cv-title { margin: 0; font-size: 20px; font-weight: 600; color: var(--ink); }
.cv-country { color: var(--blue); font-weight: 700; }
#oppCard .cv-next { font-size: 17px; margin: 30px 0 12px; }
@media (max-width: 900px) { .cv-stats { grid-template-columns: 1fr 1fr; } }
@media (max-width: 700px) { .cv-stats { grid-template-columns: 1fr; gap: 12px; } #oppCard .cv-stats > div { padding: 12px 14px; } #oppCard .cv-stats .cv-num { font-size: 24px; margin-top: 4px; } #oppCard .cv-spark { padding-top: 6px; } #oppCard .cv-spark .spark-host { min-height: 58px; } #oppCard .cv-bridge { padding-top: 8px; gap: 4px; } }
.cv-stats > div { background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 16px 18px; }
#oppCard .cv-stats .cv-num { font-size: 28px; }
.op-card { padding: 8px 18px 14px; }
.cv-stats > div { display: flex; flex-direction: column; }
.cv-spark { margin-top: auto; padding-top: 10px; display: flex; }
.cv-spark .spark-host { min-height: 78px; }
.cv-bridge { margin-top: auto; padding-top: 12px; display: grid; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.cv-bridge div { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 6px; }
.cv-bridge b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.cv-lead { margin: -6px 0 12px; font-size: 13.5px; color: var(--ink-2); }
.cv-d b { color: var(--ink); font-weight: 600; }
.cv-pick { display: flex; align-items: center; gap: 10px; margin: 0 0 18px; }
.cv-pick select { font: inherit; font-size: 14px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); min-width: 240px; }
.cv-num { font-size: 24px; font-weight: 600; margin-top: 6px; }
.cv-num.neg { color: var(--orange-ink); } .cv-num.pos { color: var(--teal-ink); }
.cv-d { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.cv-d .chip { background: var(--soft); }
.opp-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 28px; align-items: stretch; }
#countryCard { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "a s" "b b"; align-items: center; column-gap: 28px; row-gap: 14px; padding: 16px 22px; }
#countryCard .cx-a { grid-area: a; } #countryCard .cx-b { grid-area: b; } #countryCard .cx-stats { grid-area: s; }
#countryCard .cx-head { white-space: nowrap; }
#countryCard h4 { margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
#countryCard .cx-head { justify-content: flex-start; }
#countryCard .cx-segs { margin-top: 0; }
#countryCard .cx-stats { margin: 0; padding: 0 0 0 28px; border-top: 0; border-left: 1px solid var(--line); gap: 32px; }
#countryCard .cx-stats .cx-num { margin-top: 4px; }
@media (max-width: 700px) { #countryCard { grid-template-columns: 1fr; grid-template-areas: "a" "s" "b"; } #countryCard .cx-stats { padding: 14px 0 0; border-left: 0; border-top: 1px solid var(--line); } }
.cx-card { padding: 18px 20px; display: flex; flex-direction: column; }
.cx-card h4 { margin: 0 0 14px; font-size: 15px; font-weight: 600; }
.cx-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.cx-big { font-size: 30px; font-weight: 600; } .cx-big small { font-size: 16px; color: var(--ink-2); font-weight: 500; }
.cx-cap { font-size: 13px; color: var(--ink-2); }
.cx-segs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; margin-top: 12px; }
.cx-segs span { height: 22px; border-radius: 5px; cursor: default; }
.cx-segs .ok, .cx-legend .ok::before { background: #3fa38c; } .cx-segs .no, .cx-legend .no::before { background: #e3967b; }
.cx-legend { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12.5px; color: var(--ink-2); }
.cx-legend span::before { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
.cx-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.cx-num { font-size: 24px; font-weight: 600; margin-top: 6px; } .cx-num.big { font-size: 32px; } .cx-num.neg { color: var(--orange-ink); } .cx-num.ok { color: var(--teal-ink); }
.cx-note { margin: auto 0 0; padding-top: 14px; font-size: 11.5px; color: var(--muted); }
.op-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.op-pair .d { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.op-pick { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 0 8px; }
.op-pick select { font: inherit; font-size: 13px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); min-width: 220px; }
.op-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.op-table th { text-align: left; font-size: 10.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 6px 6px; border-bottom: 1px solid var(--line); }
.op-table td { padding: 7px 6px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.op-table th.num, .op-table td.num { text-align: right; }
.op-table tr.big td:first-child { font-weight: 600; color: var(--blue); }
.op-table td.okc { color: var(--teal-ink); font-weight: 600; }
.ue-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 28px; align-items: stretch; }
.pb-card { display: flex; flex-direction: column; padding: 18px 20px; }
.pb-card h4 { margin: 0 0 14px; font-size: 15px; font-weight: 600; }
.pb-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.pb-pair .v { font-size: 34px; font-weight: 600; letter-spacing: -.01em; margin: 8px 0 4px; line-height: 1.1; }

.pb-pair .v.warn { color: var(--orange-ink); }
.pb-pair .d { font-size: 12.5px; color: var(--ink-2); }

.pb-foot { margin-top: auto; padding-top: 14px; display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
@media (max-width: 1100px) { .tiles .tile .body.has-spark { grid-template-columns: 1fr; min-height: 0; } .tiles .tile .body.has-spark .spark-host { min-height: 120px; } .tiles .goal { max-width: none; }
  .ue-row, .opp-row, .pr-row, .cv-grid { grid-template-columns: 1fr; } }
@media (max-width: 900px) { .pb-row { grid-template-columns: 1fr; } }
/* Phones: one card per row, and the comparison table becomes one block per measure */
@media (max-width: 700px) {
  .tiles { grid-template-columns: 1fr !important; }
  .ue-grid { display: block; }
  .ue-r { display: grid; grid-template-columns: 1fr auto; grid-template-areas: 'step step' 'label cmp' 'eu us' 'viz viz'; column-gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }

  .ue-step { grid-area: step; } .ue-label { grid-area: label; } .ue-cmp { grid-area: cmp; }
  .ue-v.eu { grid-area: eu; text-align: left; margin-top: 6px; } .ue-v.us { grid-area: us; margin-top: 6px; }

  .pb-pair .v { font-size: 28px; }
}
.page-head .context { font-size: 13.5px; }
.tiles { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 14px 28px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 14px 16px 12px; min-width: 0; display: flex; flex-direction: column; }

<script>
'use strict';
const BASE_FILE = 'data/raw/MedCorp_Europe_Data_Pack_1.xlsx';
let raw = Pipeline.emptyRaw();
const loadedFiles = [];

// ---------- formatting ----------
const usd = (n) => '$' + Math.round(n).toLocaleString('en-US');
const usdShort = (n) => Math.abs(n) >= 1e6 ? '$' + (n / 1e6).toFixed(1) + 'M' : '$' + Math.round(n / 1e3) + 'K';
const pct = (x, d = 0) => (x * 100).toFixed(d) + '%';
const months = (x) => x.toFixed(1);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- icons (stroke, 24 grid) ----------
const ICON = {
  dollar: '<path d="M12 3v18M16.5 7.5c0-1.9-2-3-4.5-3s-4.5 1.2-4.5 3.2c0 4.6 9 2.3 9 7 0 2-2 3.3-4.5 3.3s-4.5-1.1-4.5-3"/>',
  trend: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.8"/>',
  plus: '<circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/>',
  users: '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.4.2 4 1.8 4.5 4.3"/>',
  building: '<path d="M4 20V6l8-3 8 3v14"/><path d="M9 20v-5h6v5M9 9h.01M15 9h.01M12 9h.01"/>',
  bed: '<path d="M3 18V7M3 13h18v5M21 13a3 3 0 0 0-3-3h-7v3"/><circle cx="7" cy="10.5" r="1.6"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
};
const icon = (k) => `<span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg></span>`;

// ---------- tooltip ----------
const tip = document.getElementById('tip');
document.addEventListener('mousemove', (e) => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tip.style.opacity = 0; return; }
  tip.innerHTML = t.getAttribute('data-tip');
  const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
  const y = Math.min(e.clientY + 14, window.innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.style.opacity = 1;
});

// ---------- KPI tiles ----------
// A comparison chip: colored arrow, gray % text, absolute change in parentheses
function chip(cur, base, label, absFmt, goodUp = true) {
  if (base === undefined || base === '' || base === 0 || cur === '') return '';
  const d = cur - base, rel = d / Math.abs(base);
  if (Math.abs(d) < 1e-9) return `<span class="chip"><span class="arr">●</span>0% ${label}</span>`;
  const good = (d > 0) === goodUp;
  return `<span class="chip"><span class="arr ${good ? 'good' : 'bad'}">${d > 0 ? '▲' : '▼'}</span>${(Math.abs(rel) * 100).toFixed(1)}% ${label}` +
    (absFmt ? ` <span class="abs">(${d > 0 ? '+' : '−'}${absFmt(Math.abs(d))})</span>` : '') + '</span>';
}
// Points change (for ratios like plan attainment)
function chipPts(cur, base, label) {
  if (base === undefined || base === '' || cur === '') return '';
  const d = Math.round((cur - base) * 100);
  if (!d) return `<span class="chip"><span class="arr">●</span>0 pts ${label}</span>`;
  return `<span class="chip"><span class="arr ${d > 0 ? 'good' : 'bad'}">${d > 0 ? '▲' : '▼'}</span>${Math.abs(d)} pts ${label}</span>`;
}
// Plan attainment: one decimal when rounding would hide a miss or a beat (99.7% must not read as 100%)
const attain = (a) => (Math.round(a * 100) === 100 && Math.abs(a - 1) > 1e-9 ? (a * 100).toFixed(1) : Math.round(a * 100)) + '%';
// Plan attainment as a progress bar: % above the knob, plan value as the goal
function planChip(cur, plan, absFmt, goalFmt, goalText) {
  if (!plan || cur === '') return '';
  const a = cur / plan, w = Math.min(a, 1) * 100, d = cur - plan;
  return `<div class="goal" data-tip="${esc('<b>' + attain(a) + ' of plan</b><br>Actual ' + goalFmt(cur) + ' · plan ' + goalFmt(plan) + '<br>' + (d >= 0 ? 'Above plan by ' : 'Short of plan by ') + absFmt(Math.abs(d)))}">
    <div class="gap ${d >= 0 ? 'good' : 'bad'}">${d >= 0 ? '+' : '−'}${absFmt(Math.abs(d))} ${d >= 0 ? 'above plan' : 'short'}</div><div class="track"><div class="fill" style="width:${w}%"></div><span class="knob" style="left:${w}%"><span class="pct">${attain(a)}</span></span></div>
    <div class="goal-text"><span>${goalText || 'Plan <span class="abs">' + goalFmt(plan) + '</span>'}</span></div>
  </div>`;
}
// US plan attainment as a small chip (same look as Europe, without the bar)
function planPct(cur, plan) {
  if (!plan || cur === '') return '';
  const good = cur >= plan;
  return '<span class="chip"><span class="arr ' + (good ? 'good' : 'bad') + '">' + (good ? '▲' : '▼') + '</span>' + attain(cur / plan) + ' of plan</span>';
}
const status = (ok, okText, warnText) => `<span class="chip ${ok ? 'ok' : 'warn'}">${ok ? okText : warnText}</span>`;
// Sparklines are drawn at the real size of their slot (so they fill it without distortion).
// spark() registers the series and returns a placeholder; drawSparks() renders all of them.
const SPARKS = [];
function spark(points, fmt, type) {
  if (!points || points.length < 2) return '';
  SPARKS.push({ points, fmt, type });
  return '<div class="spark-host" data-i="' + (SPARKS.length - 1) + '"></div>';
}
function sparkSvg({ points, fmt, type }, W, H, baseY, labelY) {
  const LY = labelY && labelY > 60 && labelY < H ? labelY : H - 3; // date labels share the baseline of the text under the plan bar
  // baseY: where the lowest value sits (aligned with the plan bar); dates go below it
  const L = 6, R = 6, T = 24, B = baseY && baseY > 60 && baseY < H - 16 ? H - baseY : 18;
  const vals = points.flatMap((p) => (p.plan ? [p.value, p.plan] : [p.value])), max = Math.max(...vals), min = Math.min(...vals);
  const planColor = '#b9bdcb';
  const tipOf = (p) => esc('<b>' + p.label + '</b><br>' + fmt(p.value) + (p.plan ? '<br>Plan ' + fmt(p.plan) + ' · ' + Math.round((p.value / p.plan) * 100) + '% of plan' : ''));

  // Bars (counts per period): start at zero, partial periods lighter, plan as a dot
  if (type === 'bar') {
    const n = points.length, slot = (W - L - R) / n, bw = Math.min(slot * 0.62, 26), base = H - B;
    const cx = (i) => L + slot * (i + 0.5), yb = (v) => T + (base - T) * (1 - v / (max || 1));
    let s = '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + base + '" y2="' + base + '" stroke="var(--axis)"/>';
    points.forEach((p, i) => {
      const top = yb(p.value), h = base - top, r = Math.min(3, h);
      s += '<path d="M' + (cx(i) - bw / 2) + ',' + base + ' v' + (-(h - r)) + ' q0,' + (-r) + ' ' + r + ',' + (-r) + ' h' + (bw - 2 * r) + ' q' + r + ',0 ' + r + ',' + r + ' v' + (h - r) + ' z" fill="' + (p.partial ? 'var(--blue-soft)' : 'var(--blue)') + '"/>';
      if (p.plan) s += '<circle cx="' + cx(i) + '" cy="' + yb(p.plan) + '" r="3" fill="' + planColor + '"/>';
    });
    const last = n - 1;
    s += '<text x="' + cx(0) + '" y="' + (yb(points[0].value) - 6) + '" text-anchor="middle" class="sv">' + fmt(points[0].value) + '</text>';
    s += '<text x="' + cx(last) + '" y="' + (yb(points[last].value) - 6) + '" text-anchor="middle" class="sv strong">' + fmt(points[last].value) + '</text>';
    s += '<text x="' + (cx(0) - bw / 2) + '" y="' + LY + '" class="sl">' + points[0].label + '</text><text x="' + (cx(last) + bw / 2) + '" y="' + LY + '" text-anchor="end" class="sl">' + points[last].label + '</text>';
    points.forEach((p, i) => { s += '<rect x="' + (L + slot * i) + '" y="0" width="' + slot + '" height="' + H + '" fill="transparent" data-tip="' + tipOf(p) + '"/>'; });
    return '<svg class="spark" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Bars from ' + points[0].label + ' to ' + points[last].label + '">' + s + '</svg>';
  }

  const x = (i) => L + (i * (W - L - R)) / (points.length - 1);
  const y = (v) => T + (H - T - B) * (1 - (v - min) / (max - min || 1));
  const line = points.map((p, i) => x(i) + ',' + y(p.value)).join(' ');
  const last = points.length - 1, step = (W - L - R) / last;
  let s = '<polygon points="' + x(0) + ',' + (H - B) + ' ' + line + ' ' + x(last) + ',' + (H - B) + '" fill="var(--blue-tint)" opacity=".8"/>';
  // Plan: light solid line with small filled dots; a single plan point is just a dot
  const planIdx = points.map((p, i) => (p.plan ? i : -1)).filter((i) => i >= 0);
  if (planIdx.length) {
    if (planIdx.length > 1) s += '<polyline points="' + planIdx.map((i) => x(i) + ',' + y(points[i].plan)).join(' ') + '" fill="none" stroke="#b9bdcb" stroke-width="1.6"/>';
    planIdx.forEach((i) => { s += '<circle cx="' + x(i) + '" cy="' + y(points[i].plan) + '" r="3" fill="#b9bdcb"/>'; });
  }
  s += '<polyline points="' + line + '" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/>';
  points.forEach((p, i) => { s += '<circle cx="' + x(i) + '" cy="' + y(p.value) + '" r="' + (i === last ? 3.8 : 2.4) + '" fill="' + (i === last ? 'var(--blue)' : '#fff') + '" stroke="var(--blue)" stroke-width="1.5"/>'; });
  s += '<text x="' + x(0) + '" y="' + (y(points[0].value) - 8) + '" text-anchor="start" class="sv">' + fmt(points[0].value) + '</text>';
  const lp = points[last], below = lp.plan && lp.plan > lp.value;
  s += '<text x="' + (x(last) - 6) + '" y="' + (below ? y(lp.value) + 16 : y(lp.value) - 9) + '" text-anchor="end" class="sv strong">' + fmt(lp.value) + '</text>';
  s += '<text x="' + x(0) + '" y="' + LY + '" text-anchor="start" class="sl">' + points[0].label + '</text><text x="' + x(last) + '" y="' + LY + '" text-anchor="end" class="sl">' + points[last].label + '</text>';
  // Plan legend, bottom right, left of the last date
  points.forEach((p, i) => { s += '<rect x="' + (x(i) - step / 2) + '" y="0" width="' + step + '" height="' + H + '" fill="transparent" data-tip="' + esc('<b>' + p.label + '</b><br>' + fmt(p.value) + (p.plan ? '<br>Plan ' + fmt(p.plan) + ' · ' + Math.round((p.value / p.plan) * 100) + '% of plan' : '')) + '"/>'; });
  return '<svg class="spark" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Trend from ' + points[0].label + ' to ' + points[last].label + '">' + s + '</svg>';
}
function drawSparks() {
  document.querySelectorAll('.spark-host').forEach((h) => {
    const r = h.getBoundingClientRect();
    if (!(r.width > 0 && r.height > 0)) return;
    // Align the lowest point with the plan bar of this row (if the row has one)
    // Align only with a plan bar in the same visual row (cards wrap to 2 columns on narrow screens)
    const row = h.closest('.tiles'), tile = h.closest('.tile');
    const sameRow = (el) => Math.abs(el.closest('.tile').getBoundingClientRect().top - tile.getBoundingClientRect().top) < 4;
    const track = row ? [...row.querySelectorAll('.track')].find(sameRow) : null;
    const baseY = track ? Math.round(track.getBoundingClientRect().top + track.offsetHeight / 2 - r.top) : undefined;
    const gt = row ? [...row.querySelectorAll('.goal-text')].find(sameRow) : null;
    const labelY = gt ? Math.round(gt.getBoundingClientRect().bottom - 4 - r.top) : undefined;
    h.innerHTML = sparkSvg(SPARKS[+h.dataset.i], Math.floor(r.width), Math.floor(r.height), baseY, labelY);
  });
}
// Redraw whenever a card changes size (window resize, browser zoom, layout change)
const sparkObserver = new ResizeObserver(() => { clearTimeout(drawSparks.t); drawSparks.t = setTimeout(drawSparks, 60); });
const watchSparks = () => document.querySelectorAll('.spark-host').forEach((h) => sparkObserver.observe(h));
new MutationObserver(watchSparks).observe(document.getElementById('tiles'), { childList: true, subtree: true });
new MutationObserver(watchSparks).observe(document.getElementById('oppCard'), { childList: true, subtree: true });
const usdK = (n) => (!n ? '$0' : n >= 1e6 ? '$' + (n / 1e6).toFixed(2) + 'M' : '$' + Math.round(n / 1e3) + 'K');
const usdRound = (n) => n >= 1e6 ? '$' + (n / 1e6).toFixed(1) + 'M' : '$' + Math.round(n).toLocaleString('en-US');

function tiles(m, prev, through) {
  const eu = m.EU, us = m.US, p = prev ? prev.EU : {};
  const q = through.replace('-', ' ');
  const sign = (v) => (v >= 0 ? '+' : '');
  const qRange = through.endsWith('Q1') ? 'in Q1' : 'Q1–' + through.slice(5);
  const yearAgo = (arr, key) => (arr.length > 4 ? arr[arr.length - 5][key] : '');
  const prevQ = (arr, key) => (arr.length > 1 ? arr[arr.length - 2][key] : '');
  const usGrowth = `<span class="arr">${us.yoy_growth >= 0 ? '▲' : '▼'}</span> ${pct(us.yoy_growth, 1)} YoY`;

  SPARKS.length = 0;
  const groups = [
    { title: 'Is Europe growing?',
      summary: `Europe is growing ${eu.yoy_growth >= us.yoy_growth ? 'faster' : 'slower'} than the US, ${eu.arr_attainment === '' ? '' : eu.arr_attainment >= 1 ? 'and is on its ARR plan.' : 'but remains below its ARR plan.'}`,
      facts: [`ARR ${sign(eu.yoy_growth)}${pct(eu.yoy_growth, 1)} YoY vs US ${sign(us.yoy_growth)}${pct(us.yoy_growth, 1)}`,
        eu.arr_attainment === '' ? '' : `${attain(eu.current_arr / eu.arr_plan)} of ${through.slice(5)} ARR plan vs US ${attain(us.current_arr / us.arr_plan)}`,

      tiles: [
      { label: 'Payback, typical customer', info: 'Median of CAC ÷ (ARR × 80% ÷ 12) per customer. The research memo number.',
        value: months(eu.median_payback) + '<small>months</small>',
        chips: [status(eu.median_payback <= 36, 'Within contract', 'Over contract')], spark: '',
        ref: `<b>${eu.payback_over_contract} of ${eu.active_customers}</b> customers take longer than the 36-month contract.`,
        us: months(us.median_payback) + ' months' },
      { label: 'Payback, Finance view', info: 'Total CAC ÷ total monthly gross profit. The FY26 board pack number.',

        chips: [status(eu.aggregate_payback <= 36, 'Within contract', 'Over contract')], spark: '',

        ref: `Europe in total: <b>${eu.total_contribution < 0 ? '−' : '+'}${usd(Math.abs(eu.total_contribution))}</b> a year after fixed cost.`,
        us: `one market, ${usdRound(us.total_contribution)} a year` },

  // One summary sentence per card (computed, so it follows the data), with its key numbers
  const [arrT, newT, actT] = groups[0].tiles, [perCustT, perBedT] = groups[1].tiles, [pbT, finT, ctyT] = groups[2].tiles;
  const yoyActive = yearAgo(eu.active_by_quarter, 'count'), covering = eu.contribution.filter((k) => k.contribution >= 0).map((k) => k.country === 'United Kingdom' ? 'UK' : k.country);

  arrT.facts = [`${sign(eu.yoy_growth)}${pct(eu.yoy_growth, 1)} YoY vs US ${sign(us.yoy_growth)}${pct(us.yoy_growth, 1)}`, eu.arr_plan ? `${attain(eu.current_arr / eu.arr_plan)} of ${through.slice(5)} ARR plan vs US ${attain(us.current_arr / us.arr_plan)}` : ''];
  newT.sum = `New customer growth is ${eu.new_customers_ytd > eu.new_customers_prev_ytd ? 'up' : eu.new_customers_ytd === eu.new_customers_prev_ytd ? 'flat' : 'down'} vs. last year and ${eu.new_customers_ytd >= eu.new_customers_plan_ytd ? 'on' : 'below'} plan.`;

  actT.facts = [`${sign(eu.active_customers / yoyActive - 1)}${pct(eu.active_customers / yoyActive - 1, 1)} YoY vs US ${sign(us.active_customers / yearAgo(us.active_by_quarter, 'count') - 1)}${pct(us.active_customers / yearAgo(us.active_by_quarter, 'count') - 1, 1)}`];
  perCustT.sum = `A typical European customer brings ${pct(eu.median_arr_per_customer / us.median_arr_per_customer)} of the ARR of a typical US customer.`;
  perCustT.facts = [`Median ${usdRound(eu.median_arr_per_customer)} vs US ${usdRound(us.median_arr_per_customer)}`];
  perBedT.sum = `Europe is priced at ${pct(eu.arr_per_bed / us.arr_per_bed)} of the US per bed.`;
  perBedT.facts = [`${usd(eu.arr_per_bed)} vs US ${usd(us.arr_per_bed)} per bed`];
  pbT.sum = `A typical European customer ${eu.median_payback > 36 ? 'takes longer than the 3-year contract to pay back' : 'pays back within the 3-year contract'}.`;
  pbT.facts = [`${months(eu.median_payback)} vs US ${months(us.median_payback)} months`, `${eu.payback_over_contract} of ${eu.active_customers} over 36 months`];
  finT.sum = `Across all customers together, Europe pays back ${eu.aggregate_payback <= 36 ? 'within' : 'beyond'} the contract.`;
  finT.facts = [`${months(eu.aggregate_payback)} months vs US ${months(us.aggregate_payback)}`, `2 customers hold ${pct(eu.bridge.top2_arr_share)} of EU ARR`];
  ctyT.sum = `${eu.contribution.length - eu.countries_covering_cost} of ${eu.contribution.length} countries do not cover their fixed cost.`;
  ctyT.facts = [`${covering.join(' and ') || 'None'} cover${covering.length === 1 ? 's' : ''} theirs`, `Europe ${eu.total_contribution < 0 ? '−' : '+'}${usdRound(Math.abs(eu.total_contribution))} a year`];

  // Customer profile and payback: one comparison table (unitTable). Country cost: its own card next to the payback chart.
  unitTable(eu, us);
  countryCard(eu);

  document.getElementById('tiles').innerHTML = groups.slice(0, 1).map((g) => `
    <div class="group">
      <div class="group-head"><h3>${g.title}</h3></div>
      <div style="--cols:${g.tiles.length}" class="tiles${g.tiles.some((d) => d.chips.filter(Boolean).length) ? '' : ' no-chips'}${g.tiles.some((d) => d.spark) ? '' : ' no-spark'}">${g.tiles.map((d) => `
        <div class="cell">
        <div class="summary"><p class="headline">${d.sum}</p><p class="facts">${d.facts.filter(Boolean).join('<span class="sep">|</span>')}</p></div>
        <div class="tile">
          <div class="top"><span class="label">${d.label}</span><i class="info" data-tip="${esc(d.info)}">i</i></div>
          <div class="body${d.spark ? ' has-spark' : ''}">
            <div class="main"><div class="value">${d.value}</div><div class="chips">${d.chips.filter(Boolean).join('')}</div></div>
            ${d.spark ? `<div class="spark-slot">${d.spark}</div>` : ''}
          </div>
          <div class="foot"><div class="us"><span class="label">US</span><div class="us-body"><b>${d.us}</b>${(d.usChips || []).filter(Boolean).length ? '<div class="us-chips">' + d.usChips.filter(Boolean).join('') + '</div>' : ''}</div>${d.plan ? '<span class="plan-key"><i class="act"></i>Actual<i></i>Plan</span>' : ''}</div><div class="ref">${d.ref}</div></div>
        </div>
        </div>`).join('')}</div>
    </div>`).join('');
  drawSparks();
}

// ---------- country view: how is my country doing, and who to go after next ----------
const BIG_BEDS = 1000;
let OPP = { country: '' };
function oppCard(result) {
  const eu = result.metrics.EU, t = result.data_through;
  const yearAgoQ = (+t.slice(0, 4) - 1) + t.slice(4);
  const logos = result.tables.logos.filter((l) => l.region === 'EU');
  const countries = eu.contribution.map((k) => k.country).sort();
  const bigProspects = (c) => logos.filter((l) => l.country === c && l.logo_status === 'Prospect' && l.total_beds >= BIG_BEDS).length;
  const arrIn = (c, q) => result.tables.quarterly_arr.filter((r) => r.is_valid_customer && r.country === c && r.quarter === q).reduce((s, r) => s + r.arr_usd, 0);
  OPP = {
    result, eu, logos, t, yearAgoQ, arrIn, cac: eu.median_cac,
    country: OPP.country && countries.includes(OPP.country) ? OPP.country : [...countries].sort((a, b) => bigProspects(b) - bigProspects(a))[0],
  };
  document.getElementById('oppCard').innerHTML = `
    <div class="cv-pick"><label class="label" for="oppCountry">Country</label>
      <select id="oppCountry">${countries.map((c) => `<option value="${esc(c)}"${c === OPP.country ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select>
    </div>
    <div class="cv-head"><h3 class="cv-title" id="cvTitle"></h3></div>
    <div id="cvStats"></div>
    <h3 class="cv-title cv-next">Where Should We Focus Next?</h3>
    <p class="cv-lead">Largest unconverted hospital groups, ranked by bed count.</p>
    <div class="card op-card" id="oppList"></div>`;
  document.getElementById('oppCountry').addEventListener('change', (e) => { OPP.country = e.target.value; countryStats(); oppList(); });
  countryStats();
  oppList();
}
function countryStats() {
  const { result, eu, t, yearAgoQ, arrIn, country: c } = OPP;
  const now = arrIn(c, t), before = arrIn(c, yearAgoQ);
  const cust = result.tables.customers.filter((x) => x.is_valid_customer && x.country_clean === c);
  const active = cust.filter((x) => x.is_currently_active_customer).length, churned = cust.filter((x) => x.is_churned_customer).length;
  const k = eu.contribution.find((x) => x.country === c);
  const newThisYear = cust.filter((x) => x.signed_quarter.slice(0, 4) === t.slice(0, 4)).length;
  document.getElementById('cvTitle').innerHTML = 'How is <span class="cv-country">' + esc(c) + '</span> doing?';
  // History per quarter for this country (billing), for the sparklines
  const quarters = eu.arr_by_quarter.map((d) => d.quarter);
  const qa = result.tables.quarterly_arr.filter((r) => r.is_valid_customer && r.country === c);
  const arrQ = quarters.map((q) => ({ label: q.replace('-', ' '), value: qa.filter((r) => r.quarter === q).reduce((s, r) => s + r.arr_usd, 0) }));
  const actQ = quarters.map((q) => ({ label: q.replace('-', ' '), value: new Set(qa.filter((r) => r.quarter === q && r.arr_usd > 0).map((r) => r.logo_id)).size }));
  const shareQ = arrQ.map((d, i) => ({ label: d.label, value: d.value / (eu.arr_by_quarter[i].arr || 1) }));
  const activeYearAgo = actQ.length > 4 ? actQ[actQ.length - 5].value : '';
  const shareYearAgo = shareQ.length > 4 ? shareQ[shareQ.length - 5].value : '';
  const rank = eu.contribution.findIndex((x) => x.country === c) + 1;
  const sharePts = shareYearAgo === '' ? '' : Math.round((now / eu.current_arr - shareYearAgo) * 100);
  const sp = (pts, fmt) => `<div class="cv-spark">${spark(pts, fmt)}</div>`;
  document.getElementById('cvStats').innerHTML = `
    <div class="cv-stats">
      <div><div class="label">${t.slice(5)} ARR</div><div class="cv-num">${usdK(now)}</div>
        <div class="cv-d">${before ? chip(now, before, 'YoY', usdK) : 'new this year'}</div>${sp(arrQ, usdK)}</div>
      <div><div class="label">Active customers</div><div class="cv-num">${active}</div>
        <div class="cv-d">${activeYearAgo !== '' ? chip(active, activeYearAgo, 'YoY', (d) => String(d)) : ''} ${newThisYear} signed in ${t.slice(0, 4)}${churned ? ` · ${churned} churned` : ''}</div>${sp(actQ, (v) => String(v))}</div>
      <div><div class="label">Share of European ARR</div><div class="cv-num">${pct(now / eu.current_arr)}</div>
        <div class="cv-d">${sharePts === '' ? '' : `<span class="chip"><span class="arr ${sharePts >= 0 ? 'good' : 'bad'}">${sharePts > 0 ? '▲' : sharePts < 0 ? '▼' : '●'}</span>${Math.abs(sharePts)} pts YoY</span>`}</div>${sp(shareQ, (v) => pct(v))}</div>
      <div><div class="label">Contribution, a year</div><div class="cv-num ${k.contribution < 0 ? 'neg' : 'pos'}">${k.contribution < 0 ? '−' : '+'}${usdK(Math.abs(k.contribution))}</div>
        <div class="cv-d">Annualized gross profit is <b>${usdK(Math.abs(k.contribution))} ${k.contribution < 0 ? 'below' : 'above'}</b> ${esc(c)}'s fixed operating costs. #${rank} of ${eu.contribution.length} countries.</div>
        <div class="cv-bridge"><div><span>Gross profit</span><b>${usdK(k.gross_profit)}</b></div><div><span>Fixed country cost</span><b>−${usdK(k.fixed_cost)}</b></div></div></div>
    </div>`;
  drawSparks();
}
function oppList() {
  const rows = OPP.logos.filter((l) => l.country === OPP.country && l.logo_status === 'Prospect').sort((a, b) => b.total_beds - a.total_beds).slice(0, 6);
  const big = OPP.logos.filter((l) => l.country === OPP.country && l.logo_status === 'Prospect' && l.total_beds >= BIG_BEDS).length;
  const pb = (arr) => (arr ? OPP.cac / (arr * 0.8 / 12) : '');
  document.getElementById('oppList').innerHTML = `<table class="op-table"><thead><tr><th>Logo</th><th class="num">Hospitals</th><th class="num">Beds</th><th class="num">Est. ARR</th><th class="num">Est. payback</th></tr></thead><tbody>${rows.map((l) => {
    const p = pb(l.estimated_prospect_arr);
    return `<tr class="${l.total_beds >= BIG_BEDS ? 'big' : ''}"><td>${esc(l.logo_id)}</td><td class="num">${l.n_hospitals}</td><td class="num">${l.total_beds.toLocaleString('en-US')}</td><td class="num">${usdK(l.estimated_prospect_arr)}</td><td class="num ${p && p <= 12 ? 'okc' : ''}">${p ? months(p) + ' mo' : ''}</td></tr>`;
  }).join('')}</tbody></table><p class="cx-note">${big} groups with ${BIG_BEDS.toLocaleString('en-US')}+ beds are not yet customers here. Top 6 prospects by beds. Est. ARR = beds × European ARR per bed; est. payback uses the median European CAC (${usdK(OPP.cac)}). Estimates, not quotes.</p>`;
}

// ---------- unit economics: Europe vs US, ordered as a chain ----------
// price per bed -> revenue per customer -> cost to win -> months to pay back
function unitTable(eu, us) {
  const kUsd = (v) => "$" + Math.round(v / 1000).toLocaleString("en-US") + "K";
  const ratio = (a, b) => a / b;
  const beds = (v) => Math.round(v).toLocaleString('en-US');
  const rows = [
    { step: 'Size', label: 'Beds per customer', info: `Median beds of active customers. A typical European customer owns ${eu.median_hospitals_per_customer} hospitals, a US one ${us.median_hospitals_per_customer}.`,
      eu: eu.median_beds_per_customer, us: us.median_beds_per_customer, fmt: beds, cmp: `${pct(ratio(eu.median_beds_per_customer, us.median_beds_per_customer))} of US` },
    { step: 'Price', label: 'ARR per bed', info: 'Current ARR ÷ beds of active customers. Mostly public-tender pricing in Europe.',
      eu: eu.arr_per_bed, us: us.arr_per_bed, fmt: usd, cmp: `${pct(ratio(eu.arr_per_bed, us.arr_per_bed))} of US` },
    { step: 'Revenue', label: 'ARR per customer', info: 'Median current ARR of active customers. Size × price.',
      eu: eu.median_arr_per_customer, us: us.median_arr_per_customer, fmt: kUsd, cmp: `${pct(ratio(eu.median_arr_per_customer, us.median_arr_per_customer))} of US` },
    { step: 'Cost to win', label: 'CAC per customer', info: 'Median one-time sales and marketing cost to win a customer.',
      eu: eu.median_cac, us: us.median_cac, fmt: kUsd, cmp: `${pct(ratio(eu.median_cac, us.median_cac))} of US` },
    { step: 'Payback', label: 'Typical customer', info: 'Median of CAC ÷ (ARR × 80% ÷ 12) per customer. The research memo number.',
      eu: eu.median_payback, us: us.median_payback, fmt: (v) => months(v) + ' mo', cmp: `${Math.round(ratio(eu.median_payback, us.median_payback))}× longer`, contract: true },
    { step: '', label: 'Finance view', info: 'Total CAC ÷ total monthly gross profit. The FY26 board pack number.',
      eu: eu.aggregate_payback, us: us.aggregate_payback, fmt: (v) => months(v) + ' mo', cmp: `${Math.round(ratio(eu.aggregate_payback, us.aggregate_payback))}× longer`, contract: true },
  ];
  // Payback rows share one scale, so the contract line sits in the same place
  const pbMax = Math.max(...rows.filter((r) => r.contract).flatMap((r) => [r.eu, r.us]), 40) * 1.04;
  let firstContract = true;
  const bar = (r) => {
    const max = r.contract ? pbMax : Math.max(r.eu, r.us) * 1.04;
    const w = (v) => (v / max) * 100;
    const label = r.contract && firstContract ? '<em>36-month contract</em>' : '';
    if (r.contract) firstContract = false;
    return `<div class="ue-bars">
      ${r.contract ? `<span class="ue-contract" style="left:${w(36)}%">${label}</span>` : ''}
      <div class="ue-bar eu" style="width:${w(r.eu)}%"></div>
      <div class="ue-bar us" style="width:${w(r.us)}%"></div>
    </div>`;
  };
  document.getElementById('ueSummary').innerHTML =
    `<p class="headline">European customers are smaller and pay less per bed. They generate only ${pct(ratio(eu.median_arr_per_customer, us.median_arr_per_customer))} of the ARR of US customers, but cost ${pct(ratio(eu.median_cac, us.median_cac))} as much to acquire. As a result, payback takes ${Math.round(ratio(eu.median_payback, us.median_payback))}× longer.</p>` +
    `<p class="facts">${beds(eu.median_beds_per_customer)} vs ${beds(us.median_beds_per_customer)} beds<span class="sep">|</span>${eu.median_hospitals_per_customer} vs ${us.median_hospitals_per_customer} hospitals<span class="sep">|</span>${usd(eu.arr_per_bed)} vs ${usd(us.arr_per_bed)} per bed<span class="sep">|</span>similar cost to win</p>`;
  document.getElementById('unitTable').innerHTML = `
    <div class="ue-grid">
      <div class="ue-r ue-hr"><div class="ue-h"></div><div class="ue-h">Measure</div><div class="ue-h num"><i class="dot eu"></i>Europe</div><div class="ue-h num"><i class="dot us"></i>US</div><div class="ue-h"></div><div class="ue-h num">Europe vs US</div></div>
      ${rows.map((r, i) => `<div class="ue-r${i === rows.length - 1 ? ' last' : ''}">
        <div class="ue-step">${r.step}</div>
        <div class="ue-label">${r.label} <i class="info" data-tip="${esc(r.info)}">i</i></div>
        <div class="ue-v eu num">${r.fmt(r.eu)}</div>
        <div class="ue-v us num">${r.fmt(r.us)}</div>
        <div class="ue-viz" data-tip="${esc('<b>' + r.label + '</b><br>Europe ' + r.fmt(r.eu) + '<br>US ' + r.fmt(r.us))}">${bar(r)}</div>
        <div class="ue-cmp num">${r.cmp}</div></div>`).join('')}
    </div>`;
}

// ---------- charts (plain SVG) ----------
// Compact payback card: two methods side by side, and what drives the gap
function bridgeChart(eu, us) {
  const b = eu.bridge;
  document.getElementById('paybackCard').innerHTML = `
    <h4>Why ${Math.round(eu.aggregate_payback)} vs. ${Math.round(eu.median_payback)} months?</h4>
    <div class="pb-pair">
      <div>
        <div class="label">Median payback</div>
        <div class="v ${eu.median_payback > 36 ? 'warn' : ''}">${months(eu.median_payback)}<small>mo</small></div>
        <div class="d">Typical customer · research memo</div>
      </div>
      <div>
        <div class="label">Aggregate payback</div>
        <div class="v ${eu.aggregate_payback > 36 ? 'warn' : ''}">${months(eu.aggregate_payback)}<small>mo</small></div>
        <div class="d">All customers together · Finance</div>
      </div>
    </div>
    <p class="pb-note"><b>Two large customers drive the gap:</b> ${pct(b.top2_arr_share)} of European ARR, but only ${pct(b.top2_cac_share)} of CAC.
      Excluding them, aggregate payback rises to ${Math.round(b.aggregate_without_top2)} months.</p>
    <div class="pb-foot">Standard contract term: 36 months
      <i class="info" data-tip="${esc('Payback = CAC ÷ (ARR × 80% ÷ 12). Median: the middle customer. Aggregate: total CAC ÷ total monthly gross profit. A typical US customer pays back in ' + months(us.median_payback) + ' months.')}">i</i></div>`;
}

// ---------- data notes ----------
function notes(result) {
  const rows = [];
  for (const c of result.tables.customers) {
    if (!c.is_valid_customer) rows.push(['warn', 'Excluded', c.customer_id, c.country_clean, c.customer_exclusion_reason]);
    else if (c.customer_warnings) rows.push(['ok', 'Warning, kept', c.customer_id, c.country_clean, c.customer_warnings]);
  }
  for (const e of result.tables.metric_exclusions) if (e.metric !== 'All metrics') rows.push(['warn', 'Left out of a metric', e.customer_id, e.country, e.metric + ': ' + e.reason]);
  const nEx = rows.filter((r) => r[1] === 'Excluded').length;
  document.getElementById('notesCount').textContent = rows.length;
  document.getElementById('notesSummary').innerHTML = `<b>${rows.length} data notes.</b> ${nEx} rows are excluded from all numbers; the rest are kept and flagged. Rules are in docs/Data Rules.xlsx.`;
  document.getElementById('notesBody').innerHTML = `<table class="notes"><thead><tr><th>Customer</th><th>Status</th><th>Country</th><th>Detail</th></tr></thead><tbody>${rows.map((r) =>
    `<tr><td class="id">${esc(r[2])}</td><td><span class="pill ${r[0]}">${esc(r[1])}</span></td><td>${esc(r[3])}</td><td>${esc(r[4])}</td></tr>`).join('')}</tbody></table>`;
}

// ---------- tabs ----------
function show(view) {
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.view === view)));
  document.getElementById('view-overview').hidden = view !== 'overview';
  document.getElementById('view-notes').hidden = view !== 'notes';
  document.getElementById('view-sales').hidden = view !== 'sales';
  document.body.dataset.view = view;
  requestAnimationFrame(drawSparks);
  document.getElementById('pageTitle').textContent = { notes: 'Data notes', sales: 'Country Sales View' }[view] || 'Europe Executive Summary';
}
document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => show(t.dataset.view)));

// ---------- run ----------
function render() {
  const result = Pipeline.run(raw);
  const m = result.metrics;
  const t = result.data_through, n = +t.slice(-1);
  const prevQ = n > 1 ? t.slice(0, 6) + (n - 1) : (+t.slice(0, 4) - 1) + '-Q4';
  const prev = Pipeline.run(raw, { through: prevQ });
  document.getElementById('context').innerHTML = `Data through <b>${t}</b> <span class="ctx-desc"><span class="sep">|</span> Europe's growth and unit economics each quarter, with the US for reference.</span>`;
  tiles(m, prev.data_through === prevQ ? prev.metrics : null, t);
  bridgeChart(m.EU, m.US);
  oppCard(result);
  proposalCard(result);
  marketCard(result);
  notes(result);
}

async function addFile(name, buffer) {
  const wb = XLSX.read(buffer, { type: 'array' });
  const found = Pipeline.addWorkbook(raw, XLSX, wb, name);
  if (!found.length) throw new Error('No known sheets in ' + name);
  loadedFiles.push(name);
  render();
  document.getElementById('status').textContent = 'Sources: ' + loadedFiles.join(', ');
}

fetch(BASE_FILE).then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
  .then((buf) => addFile(BASE_FILE.split('/').pop(), buf))
  .catch((e) => { document.getElementById('context').textContent = 'Could not load ' + BASE_FILE + ' (' + e.message + ')'; });

const takeFile = (f) => f && f.arrayBuffer().then((b) => addFile(f.name, b)).catch((e) => { document.getElementById('status').textContent = e.message; });
document.getElementById('file').addEventListener('change', (e) => takeFile(e.target.files[0]));
let dragDepth = 0;
addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => { e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging'); takeFile(e.dataTransfer.files[0]); });
</script>
</body>
